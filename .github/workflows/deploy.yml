name: Deploy to nest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nest
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Package release
        run: |
          mkdir release
          cp -r dist node_modules package.json release/
          tar -czf release.tgz -C release .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.NEST_SSH_KEY }}
          SSH_HOST: ${{ secrets.NEST_HOST }}
          SSH_PORT: ${{ secrets.NEST_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/nest
          chmod 600 ~/.ssh/nest
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          SSH_HOST: ${{ secrets.NEST_HOST }}
          SSH_USER: ${{ secrets.NEST_USER }}
          SSH_PORT: ${{ secrets.NEST_PORT }}
        run: |
          set -uo pipefail
          NAME="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          PORT="${SSH_PORT:-22}"
          TARGET="$SSH_USER@$SSH_HOST"
          SSHOPTS=(-i "$HOME/.ssh/nest" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          SCPOPTS=(-i "$HOME/.ssh/nest" -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)

          # The bastion closes the session without an exit status, so ssh reports
          # 255 even when the remote command worked. Verify the results instead of
          # trusting the exit code.
          ssh "${SSHOPTS[@]}" "$TARGET" "mkdir -p /var/deployments/portfolio/incoming" || true
          scp "${SCPOPTS[@]}" release.tgz "$TARGET:/var/deployments/portfolio/incoming/$NAME.tgz" || true
          scp "${SCPOPTS[@]}" deploy/deploy.sh "$TARGET:/var/deployments/portfolio/deploy.sh" || true

          uploaded="$(ssh "${SSHOPTS[@]}" "$TARGET" "test -s /var/deployments/portfolio/incoming/$NAME.tgz && test -s /var/deployments/portfolio/deploy.sh && echo UPLOAD_OK" 2>&1 || true)"
          echo "$uploaded"
          grep -q UPLOAD_OK <<<"$uploaded" || { echo "::error::release upload did not land on the server"; exit 1; }

          deployed="$(ssh "${SSHOPTS[@]}" "$TARGET" "bash /var/deployments/portfolio/deploy.sh $NAME" 2>&1 || true)"
          echo "$deployed"
          grep -q "DEPLOY_OK $NAME" <<<"$deployed" || { echo "::error::the deploy script did not report success"; exit 1; }
