name: Deploy to nest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Package release
        run: |
          mkdir release
          cp -r dist node_modules package.json release/
          tar -czf release.tgz -C release .

      - name: Configure SSH
        env:
          BASTION_KEY: ${{ secrets.NEST_SSH_KEY }}
          DIRECT_KEY: ${{ secrets.NEST_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BASTION_KEY" > ~/.ssh/nest
          printf '%s\n' "$DIRECT_KEY" > ~/.ssh/nest_direct
          chmod 600 ~/.ssh/nest ~/.ssh/nest_direct

      - name: Upload and activate release
        env:
          BASTION_HOST: ${{ secrets.NEST_HOST }}
          DIRECT_HOST: ${{ secrets.NEST_DIRECT_HOST }}
          SSH_USER: ${{ secrets.NEST_USER }}
          SSH_PORT: ${{ secrets.NEST_PORT }}
          MAIL_TOKEN: ${{ secrets.LETTERMINT_PROJECT_TOKEN }}
          MAIL_TO: ${{ secrets.CONTACT_TO }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM }}
          CAMPAIGNLARK_KEY: ${{ secrets.CAMPAIGNLARK_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -uo pipefail
          NAME="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          PORT="${SSH_PORT:-22}"
          OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR)

          # Prefer the box's own address: it runs OpenSSH 10, so the session gets
          # ML-KEM post-quantum key exchange. The hackclub SSH proxy only offers
          # curve25519, so it stays as a fallback for networks without IPv6.
          TARGET=""
          KEY=""
          for attempt in 1 2 3; do
            if [ -n "${DIRECT_HOST:-}" ] && ssh -i "$HOME/.ssh/nest_direct" "${OPTS[@]}" -p "$PORT" "root@$DIRECT_HOST" true 2>/dev/null; then
              TARGET="root@$DIRECT_HOST"
              KEY="$HOME/.ssh/nest_direct"
              echo "transport: direct (post-quantum key exchange)"
              break
            fi
            if ssh -i "$HOME/.ssh/nest" "${OPTS[@]}" -p "$PORT" "$SSH_USER@$BASTION_HOST" true 2>/dev/null; then
              TARGET="$SSH_USER@$BASTION_HOST"
              KEY="$HOME/.ssh/nest"
              echo "transport: hackclub proxy (no post-quantum key exchange)"
              break
            fi
            echo "attempt $attempt: nest unreachable, retrying"
            sleep 15
          done
          if [ -z "$TARGET" ]; then
            echo "::error::could not reach nest over any transport"
            exit 1
          fi

          # Mail and newsletter settings come from repository secrets and land in
          # their own env file, so rotating a key or changing the addresses happens
          # here. Values are never echoed.
          if [ -n "${MAIL_TOKEN:-}" ]; then
            mail=""
            for attempt in 1 2 3; do
              printf 'LETTERMINT_PROJECT_TOKEN=%s\nCONTACT_TO=%s\nMAIL_FROM=%s\nCAMPAIGNLARK_API_KEY=%s\nTURNSTILE_SECRET_KEY=%s\n' "$MAIL_TOKEN" "${MAIL_TO:-}" "${MAIL_FROM_ADDRESS:-}" "${CAMPAIGNLARK_KEY:-}" "${TURNSTILE_SECRET:-}" \
                | ssh -i "$KEY" "${OPTS[@]}" -p "$PORT" "$TARGET" "umask 077; cat > /etc/portfolio-mail.env" || true
              mail="$(ssh -i "$KEY" "${OPTS[@]}" -p "$PORT" "$TARGET" "grep -q '^CAMPAIGNLARK_API_KEY=.' /etc/portfolio-mail.env && grep -q '^TURNSTILE_SECRET_KEY=.' /etc/portfolio-mail.env && echo MAIL_OK" 2>&1 || true)"
              grep -q MAIL_OK <<<"$mail" && break
              echo "mail sync attempt $attempt did not land: ${mail:-no answer}"
              sleep 5
            done
            echo "mail credentials: ${mail:-not installed}"
            grep -q MAIL_OK <<<"$mail" || { echo "::error::could not install the mail credentials on nest"; exit 1; }
          else
            echo "::warning::LETTERMINT_PROJECT_TOKEN is not set; the contact form will answer not_configured"
          fi

          # The proxy drops sessions without an exit status, so ssh can report 255
          # even when the remote command worked. Verify results instead.
          ssh -i "$KEY" "${OPTS[@]}" -p "$PORT" "$TARGET" "mkdir -p /var/deployments/portfolio/incoming" || true

          # The proxy drops long transfers, so retry until the remote copy matches
          # the tarball we built instead of failing the release on one bad session.
          SIZE="$(wc -c < release.tgz)"
          uploaded=""
          for attempt in 1 2 3; do
            scp -i "$KEY" "${OPTS[@]}" -P "$PORT" release.tgz "$TARGET:/var/deployments/portfolio/incoming/$NAME.tgz" || true
            scp -i "$KEY" "${OPTS[@]}" -P "$PORT" deploy/deploy.sh "$TARGET:/var/deployments/portfolio/deploy.sh" || true
            uploaded="$(ssh -i "$KEY" "${OPTS[@]}" -p "$PORT" "$TARGET" "test \"\$(wc -c < /var/deployments/portfolio/incoming/$NAME.tgz)\" = $SIZE && test -s /var/deployments/portfolio/deploy.sh && echo UPLOAD_OK" 2>&1 || true)"
            echo "upload attempt $attempt: ${uploaded:-no answer}"
            grep -q UPLOAD_OK <<<"$uploaded" && break
            sleep 10
          done
          grep -q UPLOAD_OK <<<"$uploaded" || { echo "::error::release upload did not land on the server"; exit 1; }

          deployed=""
          for attempt in 1 2 3; do
            deployed="$(ssh -i "$KEY" "${OPTS[@]}" -p "$PORT" "$TARGET" "bash /var/deployments/portfolio/deploy.sh $NAME" 2>&1 || true)"
            echo "$deployed" | tail -8
            grep -q "DEPLOY_OK $NAME" <<<"$deployed" && break
            echo "deploy attempt $attempt did not report success"
            sleep 10
          done
          grep -q "DEPLOY_OK $NAME" <<<"$deployed" || { echo "::error::the deploy script did not report success"; exit 1; }
